name: gerar widgets do perfil

on:
  # Uma vez por dia, 05:00 UTC (02:00 em Brasília)
  schedule:
    - cron: "0 5 * * *"

  # Permite execução manual
  workflow_dispatch:

  # Roda em cada push na branch principal (este repo usa master, o gblsun/gblsun usa main)
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Gerar a animação da cobra
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#58f7ff&color_dots=#101521,#2b3950,#8b7cff,#ff4fd8,#58f7ff
            dist/github-contribution-grid-snake-light.svg?color_snake=#6b4be0&color_dots=#eef2f8,#c9d6ea,#8b7cff,#e02bb8,#0e9fb8

      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar o Pillow
        run: pip install --disable-pip-version-check --quiet pillow

      - name: Gerar banner, stats, linguagens, atividade, Medium e Spotify
        env:
          # PROFILE_TOKEN é opcional: um PAT com escopo `repo` inclui os repos privados nas somas
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          # Opcionais: sem eles o card do Spotify vira um card fixo, não quebra
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/profile_widgets.py --out dist

      - name: Publicar os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Linha do tempo: 2023 ETEC, 2024 Faculdade Impacta, 2025 PwC, 2026 sexto semestre">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="100%" stop-color="#58F7FF"/>
    </linearGradient>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="787" y2="0">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="35%" stop-color="#8B7CFF"/>
      <stop offset="68%" stop-color="#58F7FF"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="80" y="100" width="740" height="40">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Os marcos já nascem visíveis: a animação só os traz. Antes eles ficavam
       em opacity 0 até 3s, e quem pegasse a imagem antes disso via a linha do
       tempo quase vazia. -->
  <style>
    .mk   { animation: reveal .3s ease-out backwards; }
    .draw { animation: draw .9s ease-out .1s backwards; }
    .ping { animation: ping 1.8s ease-out 1s infinite; }
    @keyframes reveal { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 675; } }
    @keyframes ping { from { r: 11px; opacity: .9; } to { r: 24px; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .mk, .draw { animation: none; }
      .ping { animation: none; opacity: 0; }
    }
  </style>

  <rect x="1.5" y="1.5" width="897" height="257" rx="14" fill="#101521" stroke="url(#frameGrad)" stroke-width="1.6"/>
  <text x="28" y="38" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#7C8CA5"><tspan fill="#58F7FF">$</tspan> git log --reverse --oneline trajetoria</text>

  <line x1="112" y1="120" x2="787" y2="120" stroke="#2B3950" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="120" x2="787" y2="120" stroke="url(#lineGrad)" stroke-width="6" stroke-opacity="0.55" filter="url(#glow)" stroke-dasharray="675" class="draw"/>
  <line x1="112" y1="120" x2="787" y2="120" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="675" class="draw"/>

  <g class="mk" style="animation-delay:0.15s">
    <text x="112" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#FF4FD8">2023</text>
    <circle cx="112" cy="120" r="11" fill="#101521" stroke="#FF4FD8" stroke-width="2"/>
    <circle cx="112" cy="120" r="5" fill="#FF4FD8"/>
    <text x="112" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#E8EEF5">ETEC</text>
    <text x="112" y="184" text-anchor="middle" font-size="13" fill="#A9B8CC">Técnico em Informática</text>
    <text x="112" y="202" text-anchor="middle" font-size="13" fill="#A9B8CC">para Internet</text>
  </g>

  <g class="mk" style="animation-delay:0.30s">
    <text x="337" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#8B7CFF">2024</text>
    <circle cx="337" cy="120" r="11" fill="#101521" stroke="#8B7CFF" stroke-width="2"/>
    <circle cx="337" cy="120" r="5" fill="#8B7CFF"/>
    <text x="337" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#E8EEF5">Faculdade Impacta</text>
    <text x="337" y="184" text-anchor="middle" font-size="13" fill="#A9B8CC">Início do Bacharelado em</text>
    <text x="337" y="202" text-anchor="middle" font-size="13" fill="#A9B8CC">Ciência da Computação</text>
  </g>

  <g class="mk" style="animation-delay:0.45s">
    <text x="562" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#58F7FF">2025</text>
    <circle cx="562" cy="120" r="11" fill="#101521" stroke="#58F7FF" stroke-width="2"/>
    <circle cx="562" cy="120" r="5" fill="#58F7FF"/>
    <text x="562" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#E8EEF5">PwC</text>
    <text x="562" y="184" text-anchor="middle" font-size="13" fill="#A9B8CC">Data &amp; Analytics Intern</text>
    <text x="562" y="202" text-anchor="middle" font-size="13" fill="#A9B8CC">Advisory Consulting</text>
  </g>

  <g class="mk" style="animation-delay:0.60s">
    <text x="787" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#FFC857">2026</text>
    <circle class="ping" cx="787" cy="120" r="11" fill="none" stroke="#FFC857" stroke-width="2"/>
    <circle cx="787" cy="120" r="11" fill="#101521" stroke="#FFC857" stroke-width="2"/>
    <circle cx="787" cy="120" r="5" fill="#FFC857"/>
    <text x="787" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#E8EEF5">6º semestre</text>
    <text x="787" y="184" text-anchor="middle" font-size="13" fill="#A9B8CC">Compiladores (MiniC) e</text>
    <text x="787" y="202" text-anchor="middle" font-size="13" fill="#A9B8CC">Computação Gráfica 3D</text>
    <circle cx="764" cy="229" r="3.5" fill="#FFC857"/>
    <text x="774" y="233" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#FFC857">agora</text>
  </g>
</svg>

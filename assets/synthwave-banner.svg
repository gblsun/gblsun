    <polygon points="1600,253 1600,195 1480,155 1360,210 1240,160 1120,220 1000,180 1000,253" fill="#2a0f36"/>
    <polygon points="600,253 600,210 700,185 800,225 900,190 1000,253" fill="#3d1450"/>
  </g>

  <g clip-path="url(#aboveHorizon)">

      <animate attributeName="y2" values="253;400;253" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="258" x2="1600" y2="258">
      <animate attributeName="y1" values="253;400;253" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="253;400;253" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="258" x2="1600" y2="258">
      <animate attributeName="y1" values="253;400;253" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="253;400;253" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="258" x2="1600" y2="258">
      <animate attributeName="y1" values="253;400;253" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="253;400;253" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </line>

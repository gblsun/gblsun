    <line x1="800" y1="253" x2="140" y2="400"/>
    <line x1="800" y1="253" x2="320" y2="400"/>
    <line x1="800" y1="253" x2="480" y2="400"/>
    <line x1="800" y1="253" x2="640" y2="400"/>
    <line x1="800" y1="253" x2="800" y2="400"/>
    <line x1="800" y1="253" x2="960" y2="400"/>
    <line x1="800" y1="253" x2="1120" y2="400"/>
    <line x1="800" y1="253" x2="1280" y2="400"/>
    <line x1="800" y1="253" x2="1440" y2="400"/>
    <line x1="800" y1="253" x2="1640" y2="400"/>
    <line x1="800" y1="253" x2="1860" y2="400"/>


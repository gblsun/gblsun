    <g fill="#0a0313">
      <rect x="712" y="204" width="176" height="5"/>
      <rect x="706" y="216" width="188" height="5"/>
      <rect x="700" y="228" width="200" height="6"/>
      <rect x="694" y="240" width="212" height="6"/>
      <rect x="688" y="253" width="224" height="7"/>
      <rect x="683" y="266" width="234" height="7"/>
      <rect x="678" y="280" width="244" height="8"/>

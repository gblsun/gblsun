    <circle cx="900" cy="18" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#aboveHorizon)" opacity="0.55">

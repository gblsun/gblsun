    <circle cx="150" cy="70" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="24" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="100" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="150" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="180" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="55" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="200" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>

    <circle cx="1540" cy="34" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1450" cy="80" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1340" cy="28" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="105" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="150" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1360" cy="180" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="50" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1560" cy="210" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.9s" repeatCount="indefinite"/></circle>


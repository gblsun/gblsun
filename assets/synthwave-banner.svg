<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner Synthwave - Gabriel Pavanelli">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0417"/>
      <stop offset="32%" stop-color="#430d3c"/>
      <stop offset="68%" stop-color="#a01e6b"/>
      <stop offset="100%" stop-color="#ef8539"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="30%" stop-color="#ef8539"/>
      <stop offset="65%" stop-color="#e5289e"/>
      <stop offset="100%" stop-color="#430d3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#e5289e"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="190"/></clipPath>
    <clipPath id="belowHorizon"><rect x="0" y="190" width="1200" height="110"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="34" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="70" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="30" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="90" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="130" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="150" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="40" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="80" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="35" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.1s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="95" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="135" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="150" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#aboveHorizon)">
    <circle cx="600" cy="190" r="82" fill="url(#sunGrad)">
      <animate attributeName="r" values="78;88;78" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g fill="#0d0417">
      <rect x="524" y="160" width="152" height="5"/>
      <rect x="519" y="171" width="162" height="5"/>
      <rect x="514" y="182" width="172" height="6"/>
      <rect x="510" y="195" width="180" height="7"/>
      <rect x="507" y="209" width="186" height="8"/>
    </g>
  </g>

  <rect x="0" y="188" width="1200" height="2.5" fill="#00e5ff" opacity="0.85"/>
  <rect x="0" y="188" width="1200" height="7" fill="#00e5ff" opacity="0.25" filter="url(#glow)"/>

  <g clip-path="url(#belowHorizon)" stroke="url(#gridGrad)" stroke-width="1.3" opacity="0.75" fill="none">
    <line x1="600" y1="190" x2="-120" y2="300"/>
    <line x1="600" y1="190" x2="40" y2="300"/>
    <line x1="600" y1="190" x2="200" y2="300"/>
    <line x1="600" y1="190" x2="360" y2="300"/>
    <line x1="600" y1="190" x2="480" y2="300"/>
    <line x1="600" y1="190" x2="600" y2="300"/>
    <line x1="600" y1="190" x2="720" y2="300"/>
    <line x1="600" y1="190" x2="840" y2="300"/>
    <line x1="600" y1="190" x2="1000" y2="300"/>
    <line x1="600" y1="190" x2="1160" y2="300"/>
    <line x1="600" y1="190" x2="1320" y2="300"/>

    <line x1="0" y1="195" x2="1200" y2="195">
      <animate attributeName="y1" values="190;300;190" dur="3.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="190;300;190" dur="3.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.5s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="195" x2="1200" y2="195">
      <animate attributeName="y1" values="190;300;190" dur="3.5s" begin="1.17s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="190;300;190" dur="3.5s" begin="1.17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.5s" begin="1.17s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="195" x2="1200" y2="195">
      <animate attributeName="y1" values="190;300;190" dur="3.5s" begin="2.33s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="190;300;190" dur="3.5s" begin="2.33s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.5s" begin="2.33s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="601" y="119" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="bold" fill="#e5289e" filter="url(#glow)">GABRIEL PAVANELLI</text>
  <text x="600" y="118" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">GABRIEL PAVANELLI</text>

  <text x="601" y="151" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#00e5ff" filter="url(#glow)" opacity="0.8">Data &amp; Analytics Intern @ PwC · Software &amp; Design</text>
  <text x="600" y="150" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#e2e9ec">Data &amp; Analytics Intern @ PwC · Software &amp; Design</text>
</svg>

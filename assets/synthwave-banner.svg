  <defs>
    <path id="frond" d="M0,0 C22,-9 55,-13 88,-5 C56,3 26,4 0,0 Z"/>
  </defs>
  <g fill="#0a0313" opacity="0.92">
    <g id="palmLeft">
      <path d="M92,400 C88,350 84,320 78,300 C90,312 96,320 100,298 C104,318 110,308 118,290" fill="none" stroke="#0a0313" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(118,290)">
        <use href="#frond" transform="rotate(-95)"/>
        <use href="#frond" transform="rotate(-55)"/>
        <use href="#frond" transform="rotate(-15)"/>
        <use href="#frond" transform="rotate(25)"/>
        <use href="#frond" transform="rotate(65)"/>
        <use href="#frond" transform="rotate(-135)"/>
      </g>
    </g>
    <g id="palmRight" transform="translate(1600,0) scale(-1,1)">
      <path d="M92,400 C88,350 84,320 78,300 C90,312 96,320 100,298 C104,318 110,308 118,290" fill="none" stroke="#0a0313" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(118,290)">
        <use href="#frond" transform="rotate(-95)"/>
        <use href="#frond" transform="rotate(-55)"/>
        <use href="#frond" transform="rotate(-15)"/>
        <use href="#frond" transform="rotate(25)"/>
        <use href="#frond" transform="rotate(65)"/>
        <use href="#frond" transform="rotate(-135)"/>
      </g>
    </g>
  </g>

  <rect x="0" y="0" width="1600" height="400" fill="url(#vignette)"/>

  <rect x="0" y="0" width="1600" height="14" fill="#ffffff" opacity="0.06">

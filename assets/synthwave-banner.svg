  <text x="802" y="158" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="bold" fill="#e5289e" filter="url(#glowSoft)" opacity="0.9">GABRIEL PAVANELLI</text>
  <text x="801" y="157" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="bold" fill="#e5289e" filter="url(#glow)">GABRIEL PAVANELLI</text>
  <text x="800" y="156" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="bold" fill="#ffffff">GABRIEL PAVANELLI</text>

  <text x="801" y="201" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#00e5ff" filter="url(#glow)" opacity="0.85">Data &amp; Analytics Intern @ PwC · Software &amp; Design</text>
  <text x="800" y="200" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#e2e9ec">Data &amp; Analytics Intern @ PwC · Software &amp; Design</text>
</svg>

<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner Synthwave - Gabriel Pavanelli">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0313"/>
      <stop offset="28%" stop-color="#430d3c"/>
      <stop offset="62%" stop-color="#a01e6b"/>
      <stop offset="100%" stop-color="#ef8539"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="28%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ef8539"/>
      <stop offset="80%" stop-color="#e5289e"/>
      <stop offset="100%" stop-color="#430d3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#e5289e"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1600" height="253"/></clipPath>
    <clipPath id="belowHorizon"><rect x="0" y="253" width="1600" height="147"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#sky)"/>

  <g fill="#ffffff">

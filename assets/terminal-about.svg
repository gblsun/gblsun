<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" role="img" aria-label="Terminal: whoami devolve gabriel_pavanelli, o cargo é Data e Analytics Intern na PwC e a stack é Python, Java, TypeScript, C e Elixir">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="100%" stop-color="#58F7FF"/>
    </linearGradient>
  </defs>
  <!-- As linhas já nascem visíveis e a animação só as traz de baixo: se ela não
       rodar (movimento reduzido, leitor estático, quadro capturado no início),
       o terminal aparece cheio em vez de vazio. -->
  <style>
    .ln  { animation: reveal .28s ease-out backwards; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes reveal { from { opacity: 0; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln, .cur { animation: none; }
    }
  </style>

  <rect x="1.5" y="1.5" width="637" height="233" rx="14" fill="#101521" stroke="url(#frameGrad)" stroke-width="1.6"/>
  <path d="M1.5 15.5 A14 14 0 0 1 15.5 1.5 H624.5 A14 14 0 0 1 638.5 15.5 V32 H1.5 Z" fill="#1B2433"/>
  <line x1="1.5" y1="32" x2="638.5" y2="32" stroke="#2B3950" stroke-width="1"/>

  <circle cx="22" cy="16" r="6" fill="#FF4FD8"/>
  <circle cx="42" cy="16" r="6" fill="#FFC857"/>
  <circle cx="62" cy="16" r="6" fill="#58F7FF"/>
  <text x="320" y="20" text-anchor="middle" font-size="12" fill="#7C8CA5">gabriel@hyperpop:~</text>

  <g font-size="15">
    <text class="ln" x="24" y="64" fill="#58F7FF" style="animation-delay:.05s">$ whoami</text>
    <text class="ln" x="24" y="88" fill="#FF4FD8" style="animation-delay:.18s">&gt; gabriel_pavanelli</text>
    <text class="ln" x="24" y="112" fill="#58F7FF" style="animation-delay:.31s">$ cat pyproject.toml</text>
    <text class="ln" x="24" y="136" fill="#FF4FD8" style="animation-delay:.44s">&gt; role = "Data &amp; Analytics Intern @ PwC"</text>
    <text class="ln" x="24" y="160" fill="#58F7FF" style="animation-delay:.57s">$ echo $STACK</text>
    <text class="ln" x="24" y="184" fill="#FF4FD8" style="animation-delay:.70s">&gt; Python · Java · TypeScript · C · Elixir</text>
    <text class="ln" x="24" y="208" fill="#58F7FF" style="animation-delay:.83s">$</text>
  </g>
  <rect class="cur" x="40" y="196" width="9" height="16" fill="#58F7FF"/>
</svg>

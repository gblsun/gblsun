<svg viewBox="0 0 1200 16" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divisor neon">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#430d3c" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e5289e"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="80%" stop-color="#ef8539"/>
      <stop offset="100%" stop-color="#430d3c" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="6" width="1200" height="4" fill="url(#divGrad)" filter="url(#divGlow)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="7" width="1200" height="2" fill="url(#divGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>

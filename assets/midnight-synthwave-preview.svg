<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="Status line do tema Claude Code Midnight Synthwave">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2e97"/>
      <stop offset="100%" stop-color="#36f9f6"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="637" height="297" rx="14" fill="#0c0714" stroke="url(#frameGrad)" stroke-width="1.6"/>
  <path d="M1.5 15.5 A14 14 0 0 1 15.5 1.5 H624.5 A14 14 0 0 1 638.5 15.5 V32 H1.5 Z" fill="#1a0b2e"/>
  <line x1="1.5" y1="32" x2="638.5" y2="32" stroke="#4b3d66" stroke-width="1"/>

  <circle cx="22" cy="16" r="6" fill="#ff2e97"/>
  <circle cx="42" cy="16" r="6" fill="#b967ff"/>
  <circle cx="62" cy="16" r="6" fill="#36f9f6"/>
  <text x="320" y="20" text-anchor="middle" font-size="12" fill="#9a86c2">Claude Code · Midnight Synthwave</text>

  <text x="24" y="62" font-size="13" fill="#d8cfe6"><tspan fill="#ff2e97">&gt;</tspan> rode os testes da status line</text>
  <text x="24" y="88" font-size="13" fill="#ff2e97">✻ Cruzando o grid…<tspan fill="#9a86c2"> (12s · esc para interromper)</tspan><animate attributeName="fill" values="#ff2e97;#b967ff;#36f9f6;#ff2e97" dur="3s" repeatCount="indefinite"/></text>
  <line x1="24" y1="106" x2="616" y2="106" stroke="#4b3d66" stroke-width="1"/>

  <g font-size="12.5" fill="#9a86c2">
    <text x="24" y="132" opacity="0">sessão <tspan fill="#b967ff">meu-projeto</tspan><tspan fill="#4b3d66"> │ </tspan>modelo <tspan fill="#ff2e97">Opus</tspan> · esforço <tspan fill="#e5dcf2">xhigh</tspan><tspan fill="#4b3d66"> │ </tspan>branch <tspan fill="#b967ff">main</tspan> · <tspan fill="#ff8b39">3 alterados</tspan><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/></text>
    <text x="24" y="156" opacity="0">repo <tspan fill="#36f9f6">gblsun/claude-code-midnight-synthwave</tspan><tspan fill="#4b3d66"> │ </tspan>último commit <tspan fill="#e5dcf2">há 44m</tspan><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/></text>
    <text x="24" y="180" opacity="0">contexto <tspan fill="#36f9f6">███░░░░░░░ 32%</tspan> · <tspan fill="#e5dcf2">64k de 200k</tspan><tspan fill="#4b3d66"> │ </tspan>limite 5h <tspan fill="#36f9f6">24%</tspan><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/></text>
    <text x="24" y="204" opacity="0">cache <tspan fill="#36f9f6">● ativo</tspan> · acerto <tspan fill="#e5dcf2">91%</tspan><tspan fill="#4b3d66"> │ </tspan>custo <tspan fill="#ff2e97">$1,23 · $1,14/h</tspan><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/></text>
    <text x="24" y="228" opacity="0">cpu <tspan fill="#36f9f6">36%</tspan> · gpu <tspan fill="#36f9f6">25%</tspan> · ram <tspan fill="#e5dcf2">10,5/15,8 GB</tspan> <tspan fill="#fede5d">67%</tspan><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/></text>
    <text x="24" y="252" opacity="0">discos C: <tspan fill="#e5dcf2">15/118 GB livres</tspan><tspan fill="#4b3d66"> │ </tspan>bateria <tspan fill="#ff8b39">16%</tspan> na tomada<animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/></text>
    <text x="24" y="276" opacity="0">duração <tspan fill="#ff2e97">1h05m</tspan><tspan fill="#4b3d66"> │ </tspan>linhas <tspan fill="#36f9f6">+156</tspan> <tspan fill="#ff8b39">-23</tspan><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.3s" fill="freeze"/></text>
  </g>

  <!-- bonequinho do Claude Code, desenhado em pixels (5px por quadrante dos caracteres de bloco) -->
  <g fill="#d77757" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/>
    <rect x="535" y="244" width="60" height="5"/>
    <rect x="535" y="249" width="10" height="5"/>
    <rect x="550" y="249" width="30" height="5"/>
    <rect x="585" y="249" width="10" height="5"/>
    <rect x="525" y="254" width="80" height="5"/>
    <rect x="535" y="259" width="60" height="5"/>
    <rect x="540" y="264" width="5" height="5"/>
    <rect x="550" y="264" width="5" height="5"/>
    <rect x="575" y="264" width="5" height="5"/>
    <rect x="585" y="264" width="5" height="5"/>
  </g>

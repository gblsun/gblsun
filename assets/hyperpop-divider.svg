<svg viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divisor cromado hyperpop">
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#101521" stop-opacity="0"/><stop offset=".18" stop-color="#58f7ff"/><stop offset=".38" stop-color="#ff4fd8"/><stop offset=".55" stop-color="#e8eef5"/><stop offset=".72" stop-color="#8b7cff"/><stop offset="1" stop-color="#101521" stop-opacity="0"/></linearGradient>
    <!-- O brilho viaja animando o próprio gradiente. A versão anterior animava
         stroke-dashoffset sem stroke-dasharray, o que não produz movimento algum. -->
    <linearGradient id="sheen" x1="-.3" y1="0" x2=".1" y2="0">
      <stop stop-color="#f8fbff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0"/>
      <animate attributeName="x1" values="-.3;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values=".1;1.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .sheen, .pulse { display: none; }
    }
  </style>
  <path d="M0 12 C130 3 180 21 300 12 S470 3 600 12 S780 21 900 12 S1060 3 1200 12" fill="none" stroke="url(#liquid)" stroke-width="8" opacity=".45" filter="url(#soft)"/>
  <path d="M0 12 C130 3 180 21 300 12 S470 3 600 12 S780 21 900 12 S1060 3 1200 12" fill="none" stroke="url(#liquid)" stroke-width="3"/>
  <path class="sheen" d="M0 12 C130 3 180 21 300 12 S470 3 600 12 S780 21 900 12 S1060 3 1200 12" fill="none" stroke="url(#sheen)" stroke-width="3"/>
  <circle cx="600" cy="12" r="3" fill="#f8fbff" opacity=".55"/>
  <circle class="pulse" cx="600" cy="12" r="3" fill="#f8fbff">
    <animate attributeName="opacity" values="0;.75;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
